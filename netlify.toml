[build]
  command = "node build/build.js"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Decap CMS lives at /admin (served from dist/admin, copied from src/admin at build time).
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[dev]
  command = "node build/build.js"
  publish = "dist"
  port = 8888
